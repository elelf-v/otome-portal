<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>乙女ゲー基礎 | Otome Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div id="header"></div>

    <main>
      <h1>乙女ゲー基礎</h1>
      <p>初心者向けに、用語・選び方・遊び方を整理。</p>

      <section>
        <h2>よくある用語（仮）</h2>
        <ul>
          <li>ルート / 攻略対象 / エンディング</li>
          <li>共通ルート / 個別ルート</li>
          <li>糖度 / シリアス / 逆ハー</li>
        </ul>
      </section>

      <section>
        <h2>選び方の軸（仮）</h2>
        <ul>
          <li>物語重視 or 恋愛重視</li>
          <li>雰囲気（明るい/重い/切ない）</li>
          <li>ボリューム・テンポ</li>
        </ul>
      </section>
    </main>

    <div id="footer"></div>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
