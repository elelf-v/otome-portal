<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>始め方｜Otome Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="header"></div>

    <main>
      <h1>恥ずかしくない始め方</h1>
      <p>“ちょっと気になる”から始めるための手順。</p>

      <section>
        <h2>最初の一歩（仮）</h2>
        <ol>
          <li>気分（コメディ/切なさ/ストーリー）を決める</li>
          <li>短め作品 or 体験版から触る</li>
          <li>合わなければすぐ乗り換える（OK）</li>
        </ol>
      </section>

      <section>
        <h2>よくある不安（仮）</h2>
        <ul>
          <li>「恋愛が苦手」→ 物語重視作品へ</li>
          <li>「長いのが無理」→ 短編・テンポ重視へ</li>
          <li>「沼りそう」→ まず一本だけと決める</li>
        </ul>
      </section>
    </main>

    <div id="footer"></div>
    <script src="assets/js/main.js"></script>
  </body>
</html>
