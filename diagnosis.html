<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>タイプ診断｜Otome Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <div id="header"></div>

    <main class="page">
      <header class="page-header">
        <h1>タイプ診断</h1>
        <p class="lead">
          あなたが心地よく浸れる「物語体験」を見つけます。<br />
          直感で選んでOK。
        </p>
      </header>

      <form id="diagnosis-form" class="diagnosis">
        <fieldset class="question">
          <legend>1. 物語はどちらが好き？</legend>
          <label
            ><input type="radio" name="q1" value="a" required />
            重くても濃い方がいい</label
          >
          <label
            ><input type="radio" name="q1" value="c" />
            軽めで読みやすい方がいい</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>2. 読後に欲しいのは？</legend>
          <label
            ><input type="radio" name="q2" value="b" required />
            余韻に浸りたい</label
          >
          <label
            ><input type="radio" name="q2" value="a" />
            スッキリ納得したい</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>3. しんどい展開は？</legend>
          <label
            ><input type="radio" name="q3" value="b" required />
            あっても刺さる</label
          >
          <label
            ><input type="radio" name="q3" value="c" /> できれば少なめ</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>4. 一番惹かれるのは？</legend>
          <label
            ><input type="radio" name="q4" value="d" required />
            世界観や時代背景</label
          >
          <label
            ><input type="radio" name="q4" value="a" />
            人物の心理や関係性</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>5. テンポは？</legend>
          <label
            ><input type="radio" name="q5" value="c" required />
            会話テンポ重視</label
          >
          <label
            ><input type="radio" name="q5" value="a" /> じっくり描写重視</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>6. 主人公像は？</legend>
          <label
            ><input type="radio" name="q6" value="a" required />
            芯が強く成長する</label
          >
          <label
            ><input type="radio" name="q6" value="d" />
            世界に馴染むタイプ</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>7. 物語の魅力は？</legend>
          <label
            ><input type="radio" name="q7" value="a" required />
            構造・伏線・真相</label
          >
          <label
            ><input type="radio" name="q7" value="b" /> 感情の揺れ・救い</label
          >
        </fieldset>

        <fieldset class="question">
          <legend>8. 一番うれしい体験は？</legend>
          <label
            ><input type="radio" name="q8" value="c" required />
            笑えて元気になる</label
          >
          <label
            ><input type="radio" name="q8" value="b" />
            泣ける／胸が締めつけられる</label
          >
        </fieldset>
        <p class="note-small">
          ※結果はレコメンドページの該当タイプへ移動して表示されます。
        </p>
        <button type="submit" class="btn-primary">診断結果へ進む</button>
      </form>
    </main>

    <div id="footer"></div>
    <script src="assets/js/main.js"></script>
  </body>
</html>
